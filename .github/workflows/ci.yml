name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: file:./db/ci.db
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push schema to CI database
        run: bun run db:push

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    timeout-minutes: 20

    env:
      DATABASE_URL: file:./db/build.db
      NEXTAUTH_SECRET: build-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push schema
        run: bun run db:push

      - name: Build
        run: bun run build
        env:
          # Skip db:seed during build; do it after deploy via Vercel job.
          SKIP_PRISMHA_SEED: '1'

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    timeout-minutes: 25
    if: false # E2E requires iptv-org network access; enable per environment.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push schema
        run: bun run db:push
        env:
          DATABASE_URL: file:./db/e2e.db

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          DATABASE_URL: file:./db/e2e.db
          NEXTAUTH_SECRET: e2e-test-secret-only-do-not-use-in-prod
          NEXTAUTH_URL: http://localhost:3000
